server {
    listen 80;
    listen 443 ssl;
    server_name app.chicha.io;

    ssl_certificate /etc/nginx/conf.d/ssl/app.chicha.io_ecc/fullchain.cer;
    ssl_certificate_key /etc/nginx/conf.d/ssl/app.chicha.io_ecc/app.chicha.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/deploy;
    index index.html;
    client_max_body_size 10M;

    # Keep the installed uni-app from serving a stale app shell after release.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # OAuth popup/callback pages require relaxed cross-origin isolation.
    location = /google-callback.html {
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy "unsafe-none";
        add_header Cross-Origin-Embedder-Policy "unsafe-none";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "script-src 'self' https://accounts.google.com; connect-src 'self' https://accounts.google.com;";
    }

    location = /twitter-callback.html {
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy "unsafe-none";
        add_header Cross-Origin-Embedder-Policy "unsafe-none";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /twitter-link.html {
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy "unsafe-none";
        add_header Cross-Origin-Embedder-Policy "unsafe-none";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
